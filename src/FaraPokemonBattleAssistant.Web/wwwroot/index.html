<!DOCTYPE html>
<html lang="ja" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO-HEAD:START -->
    <title>Pokémon Battle Assistant</title>
    <!-- SEO-HEAD:END -->
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <script src="js/theme-init.js"></script>
    <!-- JavaScript が無いときは読み込み表示を出さない（本文だけが見える）。インラインの script は CSP で使えないので style で隠す -->
    <noscript><style>#boot-indicator { display: none; }</style></noscript>
</head>
<body>
    <!-- 起動までの「読み込み中…」。#app の外に置く（Blazor が #app の中身を置き換えても残るので、js/boot-indicator.js が起動後に隠す） -->
    <div id="boot-indicator" class="boot-indicator" role="status" aria-live="polite">
        <span class="boot-indicator-bar" aria-hidden="true"></span>
        <span class="boot-indicator-label">読み込み中…</span>
    </div>
    <button type="button" id="scroll-top" class="scroll-top" aria-label="いちばん上へ" title="いちばん上へ">↑</button>
    <div id="app">
        <!-- SEO-BODY:START -->
        <!-- SEO-BODY:END -->
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。ページを再読み込みしてください。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/boot-indicator.js"></script>
    <script src="js/page.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/scroll-progress.js"></script>
    <script src="js/report.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
