name: Deploy (production)

# https://pokemon.fara-labs.com/ への公開。master に push（PR のマージ含む）されるたびに実行。
# 手動で再実行したいときは Actions タブから Run workflow。
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE_MODE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開される）"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""
      first_publish:
        description: "本番の初回の公開のときだけ true（Worker fara-pokemon がまだ無いとき。404 のときの確認を通す）。それ以外では付けない"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  # 公開の途中で中断すると、アセットが中途半端な状態になりうるので、後から来た分は待たせる
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 手動実行（Run workflow）で別のブランチを選んでも、本番には master だけを公開する
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://pokemon.fara-labs.com/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # サイトはカスタムドメインのルートで公開するので、<base href="/" /> はそのまま。
      # 直接開いた URL（/speed-comparison など）は、ビルドで作る <route>.html を返す。存在しない URL は wrangler.jsonc の not_found_handling（404-page）で 404.html を 404 で返す。
      # ゲームデータ（wwwroot/api/game）は publish/wwwroot/api/game に入り、/api/game/... の静的アセットとして配られる（Worker は /api/my/* だけ）。
      - name: Publish Blazor WebAssembly
        run: dotnet publish src/FaraPokemonBattleAssistant.Web --configuration Release --output publish

      # 検索の入口ページ（/battle-terms など）の静的 HTML・robots.txt・sitemap.xml・_headers を作る（tools/build-entry-pages.mjs。kit の build を使う）
      - name: Build entry pages (production)
        run: node tools/build-entry-pages.mjs --env production

      # 有効なルート（Blazor の @page）の HTML と 404.html が全部あるか。無いと、そのページが 404 になるので、公開の前に止める
      - name: Check routes
        run: node tools/check-routes.mjs


      # push（master）と、値を指定しない手動実行は、従来どおり: 公開の前に、Cloudflare の Worker の変数 MAINTENANCE_MODE が notice（更新予定のお知らせを出している）かを確かめる。
      # 確認できないとき・notice でないときは、ここで止める（skip_maintenance_check で飛ばせる）。Worker がまだ無い（初回の公開）ときは通す。
      # maintenance_mode に true / notice / false を指定した手動実行（maintenance-cli の set）は、操作した人の意思なので、確認を飛ばす
      - name: Require MAINTENANCE_MODE=notice
        if: ${{ !contains(fromJSON('["true","notice","false"]'), inputs.maintenance_mode) }}
        run: node .github/scripts/require-maintenance.mjs fara-pokemon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          # 初回の公開（Worker がまだ無い）だけ、手動実行で first_publish を true にして通す。404 は既定で止まる
          ALLOW_MISSING_WORKER: ${{ inputs.first_publish }}

      # --var に渡す前に、文面を確かめる（200 文字まで・改行なし）。空（変更しない）は通す
      - name: Check maintenance message
        if: ${{ inputs.maintenance_message != '' }}
        run: node .github/scripts/check-maintenance-message.mjs
        env:
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}

      # push と、何も指定しない手動実行だけ、公開と同時に MAINTENANCE_MODE=true（メンテナンス画面）にする。作業が終わったら、false に戻す（お知らせも一緒に消える）。
      # skip_maintenance_check（緊急の修正）のときは、メンテナンス画面にしない。maintenance_mode を指定したときはその値、maintenance_message だけのときは MAINTENANCE_MODE を渡さない（現在の値を保持）
      - name: Deploy
        shell: bash
        run: |
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then
            vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
          elif [ -z "$MAINTENANCE_MESSAGE_INPUT" ] && [ "$SKIP_MAINTENANCE_CHECK" != "true" ]; then
            vars+=(--var "MAINTENANCE_MODE:true")   # push と、何も指定しない手動実行だけ: 従来どおり、公開と同時にメンテナンス画面にする
          fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx wrangler deploy --env="" "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary (maintenance)
        if: ${{ always() }}
        shell: bash
        run: |
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node -e '
              const j = (v) => JSON.stringify(v);
              fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}/settings`, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } })
                .then((r) => r.json())
                .then((b) => {
                  const list = b?.result?.bindings ?? [];
                  const v = (n) => { const x = list.find((y) => y.name === n); return x ? (x.type === "plain_text" ? j(x.text).replaceAll("`", "\u0027") : `(${x.type})`) : "(未設定)"; };
                  console.log(`- 反映後の現在値: MAINTENANCE_MODE=\`${v("MAINTENANCE_MODE")}\` / MAINTENANCE_MESSAGE=\`${v("MAINTENANCE_MESSAGE")}\``);
                })
                .catch(() => console.log("- 反映後の現在値: 取得できませんでした"));
            '
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-pokemon
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
