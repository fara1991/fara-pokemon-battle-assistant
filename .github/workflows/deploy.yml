name: Deploy to Cloudflare Workers

# https://pokemon.fara-labs.com/ への公開。master に push（PR のマージ含む）されるたびに実行。
# 手動で再実行したいときは Actions タブから Run workflow。
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開される）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  # 公開の途中で中断すると、アセットが中途半端な状態になりうるので、後から来た分は待たせる
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 手動実行（Run workflow）で別のブランチを選んでも、本番には master だけを公開する
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://pokemon.fara-labs.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # サイトはカスタムドメインのルートで公開するので、<base href="/" /> はそのまま。
      # 直接開いた URL（/speed-comparison など）は wrangler.jsonc の not_found_handling で index.html を返す。
      # ゲームデータ（wwwroot/api/game）は publish/wwwroot/api/game に入り、/api/game/... の静的アセットとして配られる（Worker は /api/my/* だけ）。
      - name: Publish Blazor WebAssembly
        run: dotnet publish src/FaraPokemonBattleAssistant.Web --configuration Release --output publish

      # 検索の入口ページ（/battle-terms など）の静的 HTML・robots.txt・sitemap.xml を作る（tools/build-entry-pages.mjs）
      - name: Build entry pages (production)
        run: node tools/build-entry-pages.mjs --env production

      # 本番の公開は、Cloudflare の Worker の変数 MAINTENANCE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）
      - name: Require MAINTENANCE=notice
        run: node .github/scripts/require-maintenance.mjs fara-pokemon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}

      # 公開と同時に MAINTENANCE=true（メンテナンス画面）にする。作業が終わったら、Cloudflare で false に戻す（お知らせも一緒に消える）。
      # 確認を飛ばしたとき（緊急の修正）は、メンテナンス画面にしない
      - name: Deploy
        run: npx wrangler deploy --env="" ${{ inputs.skip_maintenance_check && ' ' || '--var MAINTENANCE:true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
