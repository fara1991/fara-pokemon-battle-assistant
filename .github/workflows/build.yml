name: Build and test

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FaraPokemonBattleAssistant.sln

      - name: Build
        run: dotnet build FaraPokemonBattleAssistant.sln --configuration Release --no-restore

      - name: "検索の索引が、ページの内容と合っているか"
        # ページの文言・見出しを変えたら `npm run gen:search` で作り直して、一緒にコミットする
        run: node tools/gen-search-index.mjs --check

      - name: Test
        run: dotnet test tests/FaraPokemonBattleAssistant.Core.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: "Test (Web: データ共有・ブラウザ保存)"
        run: dotnet test tests/FaraPokemonBattleAssistant.Web.Tests --configuration Release --no-build

      - name: Publish web (sanity check)
        run: dotnet publish src/FaraPokemonBattleAssistant.Web --configuration Release --no-build --output artifacts/web

      - name: Build entry pages (sanity check)
        run: node tools/build-entry-pages.mjs --env production --dir artifacts/web/wwwroot

      - name: "入口ページの確認（ホームの HTML と canonical。/ で配られる home.html）"
        run: |
          test -f artifacts/web/wwwroot/home.html
          grep -q '<link rel="canonical" href="https://pokemon.fara-labs.com/" />' artifacts/web/wwwroot/home.html
          grep -q '<title>ホーム | Pokémon Battle Assistant</title>' artifacts/web/wwwroot/home.html
          grep -q '<title>Pokémon Battle Assistant</title>' artifacts/web/wwwroot/index.html
          ! grep -q 'entry-static' artifacts/web/wwwroot/index.html

      - name: Pack Core
        run: dotnet pack src/FaraPokemonBattleAssistant.Core --configuration Release --no-build --output artifacts/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: FaraPokemonBattleAssistant.Core-nupkg
          path: artifacts/nuget/*.nupkg

  worker:
    # データ共有 API（worker/index.js）を wrangler dev で起動して確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dry run (production / develop)
        run: |
          mkdir -p publish/wwwroot && echo '<!doctype html><title>ci</title>' > publish/wwwroot/index.html
          npx wrangler deploy --dry-run --env=""
          npx wrangler deploy --dry-run --env develop

      - name: Report endpoint test
        run: npm run test:report

      - name: Maintenance test
        run: npm run test:maintenance

      - name: Deploy gate test
        run: npm run test:gate

      - name: API test
        run: npm run test:worker

      - name: Scroll progress test
        run: npm run test:scroll

      - name: Entry pages test
        run: npm run test:entry

      - name: Kit build and CSP test (pokemon の出力と同じ・_headers の形)
        run: npm run test:kit

      - name: Search index test
        run: npm run test:search

      - name: Boot indicator test
        run: npm run test:boot

      - name: Home page (Worker) test
        run: npm run test:home

      - name: Mobile search sheet test
        run: npm run test:search-sheet
